<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="E-Commerce System built with TypeScript and the DummyJSON API"
    >

    <title>E-Commerce System</title>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">

    <!-- Header -->
    <header class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-lg">
        <div class="mx-auto max-w-7xl px-6 py-10 lg:px-8">

            <p class="mb-2 text-sm font-semibold uppercase tracking-widest text-blue-100">
                Product Catalog
            </p>

            <h1 class="text-4xl font-bold tracking-tight sm:text-5xl">
                E-Commerce System
            </h1>

            <p class="mt-3 max-w-2xl text-base leading-7 text-blue-100 sm:text-lg">
                Browse products, view discounts, and calculate final prices
                including tax.
            </p>

        </div>
    </header>


    <!-- Main Content -->
    <main class="mx-auto max-w-7xl px-6 py-10 lg:px-8">


        <!-- Search Section -->
        <section class="mb-8 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">

            <div class="mb-4">

                <h2 class="text-xl font-bold text-slate-900">
                    Product Catalog
                </h2>

                <p class="mt-1 text-sm text-slate-500">
                    Search by product name, category, or brand.
                </p>

            </div>


            <div class="relative">

                <!-- Search Icon -->
                <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4">

                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="h-5 w-5 text-slate-400"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M21 21l-4.35-4.35m2.35-5.65a8 8 0 11-16 0 8 8 0 0116 0z"
                        />
                    </svg>

                </div>


                <!-- Search Input -->
                <input
                    id="searchInput"
                    type="text"
                    placeholder="Search products..."
                    autocomplete="off"
                    class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 pl-11 text-slate-900 outline-none transition focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-100"
                >

            </div>

        </section>


        <!-- Status Message -->
        <div
            id="status"
            class="mb-6 hidden rounded-xl p-4 text-sm font-medium"
        ></div>


        <!-- Product Grid -->
        <section
            id="productContainer"
            class="grid grid-cols-1 gap-6 md:grid-cols-2 xl:grid-cols-3"
        >

            <!-- Product cards are generated by main.ts -->

        </section>

    </main>


    <!-- Footer -->
    <footer class="mt-12 border-t border-slate-200 bg-white">

        <div class="mx-auto max-w-7xl px-6 py-6 text-center text-sm text-slate-500 lg:px-8">

            E-Commerce System
            <span class="mx-2 text-slate-300">•</span>
            TypeScript
            <span class="mx-2 text-slate-300">•</span>
            DummyJSON API

        </div>

    </footer>


    <!-- TypeScript Entry Point -->
    <script
        type="module"
        src="/src/main.ts"
    ></script>

</body>
</html>
